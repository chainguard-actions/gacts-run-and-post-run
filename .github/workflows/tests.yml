# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# docs: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: 🧪 Tests

on:
  push:
    branches: [master, main]
    tags-ignore: ['**']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env: {FORCE_COLOR: 'true'}

permissions: {}

jobs:
  gitleaks:
    name: Check for GitLeaks
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - {uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
         , with: {fetch-depth: 0}}
      - uses: gacts/gitleaks@c9a0338361dc45a01aa7ebaaa5330179f3c62873 # v1

  eslint:
    name: Run code linter
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - {uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
         , with: {node-version-file: ./package.json, cache: 'npm'}}
      - run: npm install
      - run: npm run lint

  dist-built:
    name: Check distributive built state
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      dist-changed: ${{ steps.state.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - {uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
         , with: {node-version-file: ./package.json, cache: 'npm'}}
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: {name: dist, path: ./dist/, retention-days: 1}
      - id: state
        run: echo "changed=`git diff --diff-filter=ACMUXTR --name-only | grep dist/ > /dev/null && echo 'true' || echo 'false'`" >> $GITHUB_OUTPUT

  commit-and-push-fresh-dist:
    name: Commit and push fresh distributive
    needs: [dist-built]
    if: ${{ needs.dist-built.outputs.dist-changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: {name: dist, path: ./dist/}
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with: {commit_message: Automatic distributive rebuild}

  run-this-action:
    name: Run action
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run this action
        uses: ./
        with:
          run: echo "First"
              "(can be multiline)"
          post: |
            echo "First post"
            echo "(can run multiply commands)"

      - name: Post only
        uses: ./
        with:
          post: echo "Second post"

      - name: Execute without shell
        uses: ./
        with:
          shell: ''
          run: echo foo
          post: echo bar

      - name: Environment variables
        uses: ./
        env: { ENV_VAR: 'value123' }
        with:
          run: echo "$ENV_VAR" > ./test_env_var.txt
          post: if grep -q value123 ./test_env_var.txt; then echo "Test passed"; else exit 1; fi

      - name: Inline variables
        uses: ./
        env:
          SHARED_VAR: ${{ env.SHARED_VAR }}
        with:
          run: |
            INLINE_VAR="value123" ; \
            echo $INLINE_VAR; \
            if [ "$INLINE_VAR" = "value123" ]; then echo "Test passed"; else exit 1; fi
            echo "SHARED_VAR=value" >> $GITHUB_ENV
          post: |
            echo "$SHARED_VAR"
            if [ "$SHARED_VAR" = "value" ]; then echo "Test passed"; else exit 1; fi

      - name: Multiline with line breaks
        uses: ./
        with:
          run: |
            ls \
              -la \
              /tmp /opt \
                /bin
            cat /etc/passwd
          post: echo "Foo"
            echo "bar"
            echo baz \ blah \
              boom

      - name: Change post shell
        uses: ./
        with:
          run: if [ "$0" = "/usr/bin/sh" ]; then echo "Test passed"; else exit 1; fi
          shell: sh
          post: if [ "$0" = "/usr/bin/bash" ]; then echo "Test passed"; else exit 1; fi
          post-shell: bash

      - name: Post run condition
        uses: ./
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          run: echo "Use job.status variable to check the job status (success, failure or cancelled)"
          post: if [ "$JOB_STATUS" = "success" ]; then echo "Test passed"; else exit 1; fi
