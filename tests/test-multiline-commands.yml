name: Test multiline run commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with multiline run commands
        id: action
        uses: .
        with:
          run: |
            echo "line1" > /tmp/multiline-output.txt
            echo "line2" >> /tmp/multiline-output.txt
            echo "line3" >> /tmp/multiline-output.txt
          post: echo "post done"
      - name: Assert all lines were written
        run: |
          if [ ! -f /tmp/multiline-output.txt ]; then
            echo "FAIL: multiline run command did not create output file"
            exit 1
          fi
          LINE_COUNT=$(wc -l < /tmp/multiline-output.txt)
          echo "line count: $LINE_COUNT"
          if [ "$LINE_COUNT" -ne 3 ]; then
            echo "FAIL: expected 3 lines but got $LINE_COUNT"
            exit 1
          fi
          if ! grep -q "line1" /tmp/multiline-output.txt; then
            echo "FAIL: 'line1' not found in output"
            exit 1
          fi
          if ! grep -q "line2" /tmp/multiline-output.txt; then
            echo "FAIL: 'line2' not found in output"
            exit 1
          fi
          if ! grep -q "line3" /tmp/multiline-output.txt; then
            echo "FAIL: 'line3' not found in output"
            exit 1
          fi
          echo "PASS"
