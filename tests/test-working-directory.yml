name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test directory
        run: mkdir -p /tmp/test-workdir && echo "marker" > /tmp/test-workdir/marker.txt
      - id: action
        uses: .
        with:
          run: |
            if [ ! -f marker.txt ]; then
              echo "FAIL: marker.txt not found in working directory"
              exit 1
            fi
            echo "PASS: working directory is correct"
          post: echo "post step done"
          working-directory: /tmp/test-workdir
      - name: Assert action completed
        run: |
          echo "PASS: action with working-directory completed successfully"
