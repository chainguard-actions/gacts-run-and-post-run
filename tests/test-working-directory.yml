name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory
        run: mkdir -p /tmp/test-workdir
      - id: action
        uses: .
        with:
          run: pwd > /tmp/workdir-result.txt
          post: echo "post done"
          working-directory: /tmp/test-workdir
      - name: Assert working directory was used
        run: |
          if [ ! -f /tmp/workdir-result.txt ]; then
            echo "FAIL: run step did not create result file"
            exit 1
          fi
          content=$(cat /tmp/workdir-result.txt)
          echo "actual: $content"
          if [ "$content" != "/tmp/test-workdir" ]; then
            echo "FAIL: expected '/tmp/test-workdir', got '$content'"
            exit 1
          fi
          echo "PASS"
