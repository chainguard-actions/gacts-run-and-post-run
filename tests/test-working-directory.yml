name: Test working-directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create working directory with a marker file
        run: |
          mkdir -p /tmp/test-workdir
          echo "marker" > /tmp/test-workdir/marker.txt
      - id: action
        uses: .
        with:
          run: pwd > /tmp/workdir-result.txt
          post: echo "post done"
          working-directory: /tmp/test-workdir
      - name: Assert working directory was used
        run: |
          if [ ! -f /tmp/workdir-result.txt ]; then
            echo "FAIL: /tmp/workdir-result.txt not found"
            exit 1
          fi
          ACTUAL="$(cat /tmp/workdir-result.txt | tr -d '[:space:]')"
          echo "actual pwd: $ACTUAL"
          if [ "$ACTUAL" != "/tmp/test-workdir" ]; then
            echo "FAIL: expected working directory '/tmp/test-workdir' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
