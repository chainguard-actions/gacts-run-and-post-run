name: Test working directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare working directory
        run: |
          mkdir -p /tmp/test-workdir
          echo "sentinel" > /tmp/test-workdir/sentinel.txt
      - id: action
        uses: .
        with:
          run: pwd > /tmp/test-workdir/cwd-output.txt
          post: echo "post done"
          working-directory: /tmp/test-workdir
      - name: Assert working directory was used
        run: |
          if [ ! -f /tmp/test-workdir/cwd-output.txt ]; then
            echo "FAIL: cwd-output.txt not found — run command did not execute"
            exit 1
          fi
          CONTENT="$(cat /tmp/test-workdir/cwd-output.txt)"
          echo "actual cwd: $CONTENT"
          if [ "$CONTENT" != "/tmp/test-workdir" ]; then
            echo "FAIL: expected working directory '/tmp/test-workdir' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS: working directory was correctly set"
