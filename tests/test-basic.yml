name: Test basic run and post
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with run and post inputs
        id: action
        uses: .
        with:
          run: echo "hello from run step" > /tmp/run-output.txt
          post: echo "hello from post step" > /tmp/post-output.txt
      - name: Assert run output file exists
        run: |
          if [ ! -f /tmp/run-output.txt ]; then
            echo "FAIL: /tmp/run-output.txt was not created by the run input"
            exit 1
          fi
          content=$(cat /tmp/run-output.txt)
          echo "actual: $content"
          if [ "$content" != "hello from run step" ]; then
            echo "FAIL: expected 'hello from run step', got '$content'"
            exit 1
          fi
          echo "PASS"
