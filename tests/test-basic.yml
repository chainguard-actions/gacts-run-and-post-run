name: Test basic run and post-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sentinel file location
        run: mkdir -p /tmp/act-test

      - id: action
        uses: .
        with:
          run: echo "hello from run" > /tmp/act-test/run-output.txt
          post: echo "hello from post" > /tmp/act-test/post-output.txt

      - name: Assert run output file was created
        run: |
          if [ ! -f /tmp/act-test/run-output.txt ]; then
            echo "FAIL: run-output.txt was not created by the run step"
            exit 1
          fi
          content=$(cat /tmp/act-test/run-output.txt)
          echo "actual: $content"
          if [ "$content" != "hello from run" ]; then
            echo "FAIL: expected 'hello from run', got '$content'"
            exit 1
          fi
          echo "PASS"
