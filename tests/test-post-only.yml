name: Test post-only (no run command)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with only post command (run is optional)
        id: action
        uses: .
        with:
          post: echo "post-only executed" > /tmp/post-only-output.txt
      - name: Assert action completed without error
        run: |
          echo "PASS: action completed without a run command"
