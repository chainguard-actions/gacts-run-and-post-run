name: Test post-only (no run command)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare output directory
        run: mkdir -p /tmp/test-post-only
      - id: action
        uses: .
        with:
          post: echo "only post ran" > /tmp/test-post-only/post.txt
      - name: Assert action completed without run command
        run: |
          echo "PASS: action completed without a run command (run is optional)"
