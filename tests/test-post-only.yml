name: Test post-only (no run input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          post: echo "only post command"
      - name: Assert action completed without run input
        run: |
          echo "PASS: action completed without run input"
