name: Test multiline run commands
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: |
            echo "line1" > /tmp/multiline-test.txt
            echo "line2" >> /tmp/multiline-test.txt
            echo "line3" >> /tmp/multiline-test.txt
          post: echo "post done"
      - name: Assert multiline run executed all commands
        run: |
          if [ ! -f /tmp/multiline-test.txt ]; then
            echo "FAIL: /tmp/multiline-test.txt not found"
            exit 1
          fi
          LINE_COUNT="$(wc -l < /tmp/multiline-test.txt | tr -d '[:space:]')"
          echo "line count: $LINE_COUNT"
          if [ "$LINE_COUNT" != "3" ]; then
            echo "FAIL: expected 3 lines but got $LINE_COUNT"
            exit 1
          fi
          echo "PASS"
