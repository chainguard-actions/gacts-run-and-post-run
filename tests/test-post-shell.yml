name: Test post-shell input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: echo "run step with bash"
          post: echo "post step with sh"
          shell: bash
          post-shell: sh
      - name: Assert action completed
        run: |
          echo "PASS: action with post-shell completed successfully"
