name: Test post-shell input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: echo "main step running"
          post: echo "post step running with custom shell"
          shell: bash
          post-shell: sh
      - name: Assert main step ran
        run: |
          echo "PASS: action completed successfully with post-shell input"
