name: Test post-shell input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          run: echo "main run step executed"
          post: echo "post run step executed with custom shell"
          shell: bash
          post-shell: sh
      - name: Assert main run step succeeded
        run: |
          echo "PASS: main run step completed without error"
