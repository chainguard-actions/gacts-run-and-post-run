name: Test post-shell input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with post-shell specified
        id: action
        uses: .
        with:
          run: echo "run-done" > /tmp/post-shell-test.txt
          post: echo "post step with sh shell"
          shell: bash
          post-shell: sh
      - name: Assert run command executed and action accepted post-shell input
        run: |
          if [ ! -f /tmp/post-shell-test.txt ]; then
            echo "FAIL: /tmp/post-shell-test.txt not found — run command did not execute"
            exit 1
          fi
          CONTENT=$(cat /tmp/post-shell-test.txt | tr -d '[:space:]')
          echo "content: $CONTENT"
          if [ "$CONTENT" != "run-done" ]; then
            echo "FAIL: expected 'run-done', got '$CONTENT'"
            exit 1
          fi
          echo "PASS: action accepted post-shell input and run command executed"
