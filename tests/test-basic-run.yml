name: Test basic run and post-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with run and post commands
        id: action
        uses: .
        with:
          run: echo "hello from run" > /tmp/run-output.txt
          post: echo "hello from post" > /tmp/post-output.txt
      - name: Assert run command executed
        run: |
          if [ ! -f /tmp/run-output.txt ]; then
            echo "FAIL: run command did not create output file"
            exit 1
          fi
          CONTENT=$(cat /tmp/run-output.txt)
          echo "actual: $CONTENT"
          if [ "$CONTENT" != "hello from run" ]; then
            echo "FAIL: expected 'hello from run' but got '$CONTENT'"
            exit 1
          fi
          echo "PASS"
